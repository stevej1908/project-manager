name: Frontend tests

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-tests.yml'
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-tests.yml'
  workflow_dispatch:

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run component tests
        # CI=true makes react-scripts run once (no watch). jsdom-based React
        # Testing Library tests; no browser or backend needed.
        run: npx react-scripts test --watchAll=false
